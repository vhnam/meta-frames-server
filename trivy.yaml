# Trivy config, loaded by `trivy fs .` from the repository root.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
vulnerability:
  ignore-unfixed: true
scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - bin
    - tmp
    - data
    - .gitnexus
  # Local secret files: gitignored, they hold real credentials.
  skip-files:
    - .env
    - .env.*
    - google_sign_in.json
