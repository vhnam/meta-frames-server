package: api
output: internal/api/api.gen.go
generate:
  gin-server: true
  strict-server: true
  models: true
  embedded-spec: false # api/embed.go embeds the full spec instead
output-options:
  # authboss serves these routes itself (see internal/auth); /auth/me is the only generated auth handler.
  exclude-operation-ids: [register, login, logout, startPasswordRecovery, resetPassword, startGoogleSignIn, finishGoogleSignIn]
  # Keep the models of the excluded operations: internal/auth renders them.
  skip-prune: true
