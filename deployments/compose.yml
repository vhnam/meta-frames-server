services:
  db:
    image: postgres:17-alpine
    container_name: meta-frames-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metaframes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metaframes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
