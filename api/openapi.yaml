    LabOrderInput:
      type: object
      required: [labId, code, orderedAt, items]
      properties:
        labId: { type: string, format: uuid, description: Cannot change once the order has jobs (`409 order_has_jobs`) }
        code: { type: string, minLength: 1, description: The lab's order number; unique per lab (`409 order_code_taken`) }
        orderedAt: { type: string, format: date-time }
        dueDate: { type: string, format: date, description: When the order must be paid }
        vat: { type: integer, minimum: 0, description: "An amount, not a rate. Defaults to 0" }
        discount: { type: integer, minimum: 0, description: "An amount, not a rate. Defaults to 0; cannot exceed the subtotal plus VAT" }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LabOrderItemInput" }
          description: >-
            Replaces the order's lines. A line with jobs cannot be removed (`409 order_item_in_use`)
            or take less than its jobs (`409 order_item_over_quantity`).
      example:
        labId: 3eaf7b5c-1a49-4d86-c2f5-8b4dac6e9c09
        code: "0510006"
        orderedAt: "2026-10-05T10:03:00+07:00"
        dueDate: "2026-10-20"
        vat: 44800
        discount: 0
        items:
          - id: 8c2a1d63-4ea5-4f27-ab81-3d6f9e2a5b21
            product: 35mm Colour film
            options: Development + Scan, High-Resolution (JPEG only)
            quantity: 3
            unitPrice: 145000

