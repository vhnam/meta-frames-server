  /rolls/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Rolls]
      operationId: putRollNotes
      summary: Set a roll's notes, and nothing else
      description: >-
        Writes only the roll's notes (`description`), so it never reverts other fields. With
        `baseDescription`, the edit is a compare-and-set: already holding `description` is a no-op
        (200, nothing written), still holding `baseDescription` saves it, anything else is
        `409 roll_notes_conflict` and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollNotesInput" }
            examples:
              basedOn:
                summary: Add to the notes this client last saw
                value:
                  description: "Hanoi street trip, overcast, roll jammed at 30"
                  baseDescription: Hanoi street trip
              clear:
                summary: Clear the notes
                value:
                  description: ""
                  baseDescription: Hanoi street trip
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Roll
          content:
