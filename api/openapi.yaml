                    maxAperture: 1.4
                    isBuiltIn: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /lenses/{id}:
