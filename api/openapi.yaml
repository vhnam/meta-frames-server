        processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08

    Frame:
      type: object
      required: [id, number, scans]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        notes: { type: string }
        scans: { type: array, items: { $ref: "#/components/schemas/ScanRef" } }
      example:
        id: 50c19d7e-3c6b-4fa8-e4b7-ad6fce8a1e11
        number: 7
        notes: Golden hour on the bridge
        scans:
          - id: 4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10
            frameNumber: 7
            scanner: noritsu
            scannerId: d177cb3c-a850-4232-a4ca-75189b7b279b
