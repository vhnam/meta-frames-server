      responses:
        "200":
          description: Lenses now linked
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lens" } }
              examples:
                lenses:
                  summary: The new set of linked lenses
                  value:
                    - id: a3f2d8c1-6e4b-4b7a-9d15-3c8e0f7a2b03
                      brand: Nikon
                      model: Nikkor 50mm f/1.4 AI-S
                      mount: F
                      description: Sharp from f/2
                      focalLength: 50
                      maxAperture: 1.4
                      isBuiltIn: false
                      isActive: true
                      createdAt: "2026-09-01T08:30:00Z"
                      updatedAt: "2026-09-20T10:00:00Z"
                    - id: c5e91b77-2d3a-4f08-a6b4-8d1e7c3f9a04
                      brand: Nikon
                      model: Nikkor 28mm f/2.8 AI-S
                      mount: F
                      focalLength: 28
                      maxAperture: 2.8
                      isBuiltIn: false
                      isActive: true
                      createdAt: "2026-09-01T08:30:00Z"
                      updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /lenses:
    get:
      tags: [Lenses]
      operationId: listLenses
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
        - { name: preferMount, in: query, description: Lenses with this mount are listed first, schema: { type: string } }
      responses:
        "200":
          description: Lenses
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lens" } }
              examples:
                lenses:
                  summary: "Lenses, preferred mount first"
                  value:
                    - id: a3f2d8c1-6e4b-4b7a-9d15-3c8e0f7a2b03
