    RollStatus: { type: string, enum: [in_stock, in_camera, done_shooting, at_lab, developed, scanned] }
    ScannerCode:
      type: string
      enum: [noritsu, frontier, other]
      deprecated: true
      description: |
        Old way to name a scanner, kept until clients move to scanner ids. noritsu and frontier are the
        built-in Noritsu HS-1800 and Frontier SP-3000; in responses every other scanner reads as other.
        As input, other means the account's "Unknown scanner", created on first use.
    ScannerKind: { type: string, enum: [minilab, virtual_drum, drum, dedicated_film, flatbed, camera] }
    ProcessingType: { type: string, enum: [develop, develop_scan, scan, print] }

    DateInput:
      type: object
      properties:
        date: { type: string, format: date, description: Defaults to today }
      example:
        date: "2026-10-02"

    ScanSettings:
      type: object
      description: |
        Chosen value of each scan option, by option key: a string for enum options, a boolean or an
        integer. Which keys and values are allowed depends on the scanner's kind (GET /scanner-kinds).
      additionalProperties: true
      example:
        resolution: hi_res
        format: tiff

    ScanOptionValue:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }

    ScanOption:
      type: object
      required: [key, label, type, default]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [enum, boolean, integer] }
        values: { type: array, items: { $ref: "#/components/schemas/ScanOptionValue" }, description: Choices of an enum option }
        min: { type: integer, description: Lowest value of an integer option }
        max: { type: integer, description: Highest value of an integer option }
        default: { description: "Value used when the option is left out: a string, a boolean or an integer, by type" }
      example:
        key: resolution
        label: Resolution
        type: enum
        values:
          - value: standard
            label: Standard
          - value: hi_res
            label: Hi-res
        default: standard

    ScannerKindOptions:
      type: object
      required: [label, options]
      properties:
        kind: { $ref: "#/components/schemas/ScannerKind" }
        label: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ScanOption" } }
      example:
        kind: camera
        label: Camera scan
        options:
          - key: pixel_shift
            label: Pixel shift
            type: boolean
            default: false
          - key: stitch_shots
            label: Shots stitched per frame
            type: integer
            min: 1
            max: 16
            default: 1

    ScannerInput:
      type: object
      required: [brand]
      properties:
        brand: { type: string, description: "Required, e.g. Noritsu or Frontier" }
        model:
          type: string
          description: "Optional: a lab may run a Noritsu whose model nobody knows. For a camera rig, the body and lens, e.g. A7R IV + Laowa 100mm"
        kind: { $ref: "#/components/schemas/ScannerKind" }
        notes: { type: string, format: markdown, description: "Markdown text: light source, holder, conversion software" }
        defaultSettings:
          allOf: [{ $ref: "#/components/schemas/ScanSettings" }]
          description: Settings a new scan order on this scanner starts from; checked against the options of its kind
      example:
        brand: Epson
        model: V850
        kind: flatbed
        defaultSettings:
          dpi: 3200
          dust_removal: true

    Scanner:
      type: object
      required: [id, brand, name, defaultSettings, builtIn, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string, description: Absent when unknown }
        name: { type: string, description: "Brand and model (the brand alone without a model), for display" }
        kind: { $ref: "#/components/schemas/ScannerKind" }
        notes: { type: string, format: markdown, description: Markdown text }
        defaultSettings: { $ref: "#/components/schemas/ScanSettings" }
        builtIn: { type: boolean, description: "Part of the shared catalog: visible to every account, read-only" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        id: d177cb3c-a850-4232-a4ca-75189b7b279b
        brand: Noritsu
        model: HS-1800
        name: Noritsu HS-1800
        kind: minilab
        builtIn: true
        defaultSettings: {}
        createdAt: "2026-10-29T00:00:00Z"
        updatedAt: "2026-10-29T00:00:00Z"

    LabInput:
      type: object
