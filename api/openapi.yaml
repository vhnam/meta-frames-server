openapi: 3.0.3
info:
  title: Meta-Frame API
  version: 0.3.0
  description: |
    REST API for tracking rolls of film: gear, stock, shooting, processing and scans.

    **Creating records.** `POST /cameras|lenses|film-stocks|labs` assigns the id. `PUT /{resource}/{id}` is the
    idempotent create-or-update for clients that generate their own ids.

    **Deleting.** Nothing is physically deleted: `DELETE` sets `deleted_at` and the record disappears from
    every read. A deleted id stays reserved. Deleting something that is still in use is a `409`.

    **Audit.** Every change is recorded with its before/after row. Send `X-Actor: <name>` on any request to
    attribute the change; read the trail at `GET /audit-logs`.

    **Errors** always have the shape `{ code, message }`.
servers:
  - url: http://localhost:8080
tags:
  - { name: System, description: Liveness check }
  - { name: Cameras, description: Camera bodies and their lenses }
  - { name: Lenses, description: Lenses }
  - { name: Film stocks, description: Film stocks and inventory }
  - { name: Labs, description: Labs that process film }
  - { name: Rolls, description: "Rolls of film, from stock to shot, plus frames" }
  - { name: Processing, description: Sending rolls for development and scanning }
  - { name: Scans, description: Scan images }
  - { name: Stats, description: Search and statistics }
  - { name: Audit, description: Who changed what }

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check (does not touch the database)
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                up:
                  summary: Service is up
                  value:
                    status: ok

  /cameras:
    get:
      tags: [Cameras]
      operationId: listCameras
      summary: List cameras with their loaded roll (UC-09)
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Cameras
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Camera" } }
              examples:
                cameras:
                  summary: One loaded and one idle camera
                  value:
                    - id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                      brand: Nikon
                      model: FM2
                      mount: F
                      description: "Black body, bought 2019"
                      hasFixedLens: false
                      isActive: true
                      loadedRoll:
                        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
                        stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
                        stockBrand: Kodak
                        stockName: Portra 400
                        shotIso: 800
                        startedAt: "2026-09-01"
                        daysLoaded: 31
                      createdAt: "2026-09-01T08:30:00Z"
                      updatedAt: "2026-09-20T10:00:00Z"
                    - id: 0b9e4c52-3a1f-4d85-8c36-9e5a7d2f1b02
                      brand: Canon
                      model: Canonet QL17
                      hasFixedLens: true
                      builtInLensId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      isActive: true
                      createdAt: "2026-09-01T08:30:00Z"
                      updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Cameras]
      operationId: createCamera
      summary: Create a camera; the server assigns its id (UC-01, UC-07)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraInput" }
            examples:
              interchangeableLens:
                summary: Interchangeable-lens camera (needs a mount)
                value:
                  brand: Nikon
                  model: FM2
                  mount: F
                  description: "Black body, bought 2019"
                  hasFixedLens: false
              fixedLens:
                summary: Fixed-lens camera (creates its built-in lens)
                value:
                  brand: Canon
                  model: Canonet QL17
                  hasFixedLens: true
                  fixedLens:
                    focalLength: 40
                    maxAperture: 1.7
                    brand: Canon
                    model: "40mm f/1.7"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                interchangeableLens:
                  summary: Interchangeable-lens camera
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
                fixedLens:
                  summary: Fixed-lens camera with its built-in lens id
                  value:
                    id: 0b9e4c52-3a1f-4d85-8c36-9e5a7d2f1b02
                    brand: Canon
                    model: Canonet QL17
                    hasFixedLens: true
                    builtInLensId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Cameras]
      operationId: getCamera
      responses:
        "200":
          description: Camera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                loaded:
                  summary: Camera holding a roll
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    loadedRoll:
                      rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
                      stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
                      stockBrand: Kodak
                      stockName: Portra 400
                      shotIso: 800
                      startedAt: "2026-09-01"
                      daysLoaded: 31
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
                idle:
                  summary: Camera with no roll
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Cameras]
      operationId: putCamera
      summary: Create or update a camera (UC-01, UC-02, UC-07). Idempotent upsert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraInput" }
            examples:
              interchangeableLens:
                summary: Interchangeable-lens camera (needs a mount)
                value:
                  brand: Nikon
                  model: FM2
                  mount: F
                  description: "Black body, bought 2019"
                  hasFixedLens: false
              fixedLens:
                summary: Fixed-lens camera (creates its built-in lens)
                value:
                  brand: Canon
                  model: Canonet QL17
                  hasFixedLens: true
                  fixedLens:
                    focalLength: 40
                    maxAperture: 1.7
                    brand: Canon
                    model: "40mm f/1.7"
              update:
                summary: Edit an existing camera
                value:
                  brand: Nikon
                  model: FM3A
                  mount: F
                  hasFixedLens: false
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                updated:
                  summary: Updated camera
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                created:
                  summary: Created camera
                  value:
                    id: 0b9e4c52-3a1f-4d85-8c36-9e5a7d2f1b02
                    brand: Canon
                    model: Canonet QL17
                    hasFixedLens: true
                    builtInLensId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Cameras]
      operationId: deleteCamera
      summary: Delete a camera that never held a roll, together with its built-in lens
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cameras/{id}/active:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Cameras]
      operationId: setCameraActive
      summary: Activate or deactivate a camera (UC-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveInput" }
            examples:
              deactivate:
                summary: Retire a camera
                value:
                  isActive: false
              activate:
                summary: Bring it back
                value:
                  isActive: true
      responses:
        "200":
          description: Camera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                deactivated:
