                  maxAperture: 1.8
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
              examples:
                updated:
                  summary: Updated lens
                  value:
                    id: a3f2d8c1-6e4b-4b7a-9d15-3c8e0f7a2b03
                    brand: Nikon
                    model: Nikkor 50mm f/1.4 AI-S
                    mount: F
                    description: Sharp from f/2
                    focalLength: 50
                    maxAperture: 1.4
                    isBuiltIn: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
              examples:
                created:
                  summary: Created lens
                  value:
                    id: c5e91b77-2d3a-4f08-a6b4-8d1e7c3f9a04
                    brand: Nikon
                    model: Nikkor 28mm f/2.8 AI-S
                    mount: F
                    focalLength: 28
                    maxAperture: 2.8
                    isBuiltIn: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
