        type: { $ref: "#/components/schemas/ProcessingType" }
        sentAt: { type: string, format: date }
        daysSinceSent: { type: integer }
        stockName: { type: string }
      example:
        processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08
        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
        labName: Saigon Film Lab
        type: develop_scan
        sentAt: "2026-09-20"
        daysSinceSent: 12
        stockName: Kodak Portra 400

    Scan:
      type: object
      required: [id, processingId, frameId, frameNumber, scanner, fileName, sizeBytes, fileUrl]
      properties:
        id: { type: string, format: uuid }
        processingId: { type: string, format: uuid }
        frameId: { type: string, format: uuid }
        frameNumber: { type: integer }
        scanner: { $ref: "#/components/schemas/Scanner" }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        fileUrl: { type: string }
      example:
        id: 4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10
        processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08
        frameId: 50c19d7e-3c6b-4fa8-e4b7-ad6fce8a1e11
        frameNumber: 7
        scanner: noritsu
        fileName: 000007.jpg
        sizeBytes: 2481920
        fileUrl: /scans/4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10/file

    ImportPreviewInput:
      type: object
      required: [fileNames]
      properties:
        fileNames: { type: array, items: { type: string }, minItems: 1 }
        startFrame:
          type: integer
          minimum: 0
          description: Number files sequentially from here in file-name order (UC-31)
        offset:
          type: integer
          description: Added to every number read from file names (UC-30 6a)
      example:
        fileNames:
          - 000001.jpg
          - 000002.jpg
          - notes.txt
        startFrame: 1

    ImportPreviewItem:
      type: object
      required: [fileName]
      properties:
        fileName: { type: string }
        frameNumber: { type: integer, description: Absent when no number could be read }
        error: { type: string }
      example:
        fileName: 000001.jpg
        frameNumber: 1

    ImportFailure:
      type: object
      required: [fileName, reason]
      properties:
        fileName: { type: string }
        reason: { type: string }
      example:
        fileName: 000009.jpg
        reason: a scan already exists for this frame and scanner

    ImportResult:
      type: object
      required: [imported, skipped, failed, scansReceivedAt]
      properties:
        imported: { type: array, items: { $ref: "#/components/schemas/Scan" } }
        skipped: { type: array, items: { $ref: "#/components/schemas/ImportFailure" } }
        failed: { type: array, items: { $ref: "#/components/schemas/ImportFailure" } }
        scansReceivedAt: { type: string, format: date }
      example:
        imported:
          - id: 4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10
            processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08
            frameId: 50c19d7e-3c6b-4fa8-e4b7-ad6fce8a1e11
            frameNumber: 7
            scanner: noritsu
            fileName: 000007.jpg
            sizeBytes: 2481920
            fileUrl: /scans/4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10/file
        skipped:
          - fileName: 000009.jpg
            reason: a scan already exists for this frame and scanner
        failed:
          - fileName: notes.txt
            reason: not a supported image (jpeg, png, webp, tiff)
        scansReceivedAt: "2026-09-27"

    FrameComparison:
      type: object
      required: [frameNumber, missing]
      properties:
        frameNumber: { type: integer }
        noritsu: { $ref: "#/components/schemas/Scan" }
        frontier: { $ref: "#/components/schemas/Scan" }
        missing: { type: array, items: { $ref: "#/components/schemas/Scanner" } }
        previousFrameNumber: { type: integer }
        nextFrameNumber: { type: integer }
      example:
        frameNumber: 7
        noritsu:
          id: 4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10
          processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08
          frameId: 50c19d7e-3c6b-4fa8-e4b7-ad6fce8a1e11
          frameNumber: 7
          scanner: noritsu
          fileName: 000007.jpg
          sizeBytes: 2481920
          fileUrl: /scans/4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10/file
        missing:
          - frontier
        previousFrameNumber: 6
        nextFrameNumber: 8

    SearchResult:
      type: object
      required: [roll, scans]
      properties:
        roll: { $ref: "#/components/schemas/RollSummary" }
        scans: { type: array, items: { $ref: "#/components/schemas/ScanRef" } }
      example:
        roll:
          id: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
          filmStockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
          stockBrand: Kodak
          stockName: Portra 400
          cameraId: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
          cameraName: Nikon FM2
          format: 135
          exposures: 36
          status: in_camera
          shotIso: 800
          expiry:
            year: 2027
            month: 6
          price: 150000
          description: Hanoi street trip
          startedAt: "2026-09-01"
          negativesAtLab: false
        scans:
          - id: 4fb08c6d-2b5a-4e97-d3a6-9c5ebd7f0d10
            frameNumber: 7
            scanner: noritsu
            processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08

    RankedItem:
      type: object
      required: [id, label, rolls]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        rolls: { type: integer }
      example:
        id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
        label: Nikon FM2
        rolls: 12

    GearStats:
      type: object
      required: [cameras, lenses]
      properties:
        cameras: { type: array, items: { $ref: "#/components/schemas/RankedItem" } }
        lenses: { type: array, items: { $ref: "#/components/schemas/RankedItem" } }
      example:
        cameras:
          - id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
            label: Nikon FM2
            rolls: 12
        lenses:
          - id: a3f2d8c1-6e4b-4b7a-9d15-3c8e0f7a2b03
            label: Nikon Nikkor 50mm f/1.4 AI-S
            rolls: 9

    YearTimeline:
      type: object
      required: [year, months]
      properties:
        year: { type: integer }
        months: { type: array, items: { type: integer }, minItems: 12, maxItems: 12, description: Rolls started in Jan..Dec }
      example:
        year: 2026
        months: [0, 1, 3, 2, 0, 4, 6, 5, 2, 1, 0, 0]

    SpendBucket:
      type: object
      required: [filmCost, processingCost, incomplete]
      properties:
        filmCost: { type: integer }
        processingCost: { type: integer }
        incomplete: { type: boolean, description: Some prices are missing and counted as zero }
      example:
        filmCost: 750000
        processingCost: 450000
        incomplete: false

    MonthSpending:
      allOf:
        - $ref: "#/components/schemas/SpendBucket"
        - type: object
          required: [month]
          properties:
            month: { type: integer }
      example:
        month: 9
        filmCost: 150000
        processingCost: 90000
        incomplete: false

    YearSpending:
      allOf:
        - $ref: "#/components/schemas/SpendBucket"
        - type: object
          required: [year, months]
          properties:
            year: { type: integer }
            months: { type: array, items: { $ref: "#/components/schemas/MonthSpending" } }
      example:
        year: 2026
        filmCost: 750000
        processingCost: 450000
        incomplete: false
        months:
          - month: 9
            filmCost: 150000
            processingCost: 90000
            incomplete: false

    AuditEntityType:
      type: string
      enum: [camera, lens, film_stock, lab, roll, processing, frame, scan, camera_lens, roll_lens]

    AuditAction: { type: string, enum: [create, update, delete] }

    AuditLog:
      type: object
      required: [id, entityType, entityId, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        entityType: { $ref: "#/components/schemas/AuditEntityType" }
        entityId: { type: string, format: uuid, description: For camera_lens and roll_lens this is the camera or roll id }
        action: { $ref: "#/components/schemas/AuditAction" }
        before: { type: object, nullable: true, additionalProperties: true, description: "Row before the change, keyed by database column name; absent for create" }
        after: { type: object, nullable: true, additionalProperties: true, description: "Row after the change, keyed by database column name; absent for a hard delete" }
        actor: { type: string, description: Value of the X-Actor request header }
        requestId: { type: string, description: X-Request-ID of the request that made the change }
        createdAt: { type: string, format: date-time }
      example:
        id: 42
        entityType: camera
        entityId: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
        action: update
        before: { id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01, brand: Nikon, model: FM2, isActive: true }
        after: { id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01, brand: Nikon, model: FM3A, isActive: true }
        actor: nam
        requestId: 3f6c1a1e-9d0b-4b5e-8f6a-0c2d7e1b5a90
        createdAt: "2026-10-02T09:15:00Z"
