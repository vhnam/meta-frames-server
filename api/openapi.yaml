    get:
      tags: [Lenses]
      operationId: getLens
      responses:
        "200":
          description: Lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
              examples:
                lens:
                  summary: A lens
                  value:
                    id: a3f2d8c1-6e4b-4b7a-9d15-3c8e0f7a2b03
                    brand: Nikon
                    model: Nikkor 50mm f/1.4 AI-S
                    mount: F
                    description: Sharp from f/2
                    focalLength: 50
                    maxAperture: 1.4
                    isBuiltIn: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
                builtIn:
                  summary: A built-in lens
                  value:
                    id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    brand: Canon
                    model: "40mm f/1.7"
                    focalLength: 40
                    maxAperture: 1.7
                    isBuiltIn: true
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Lenses]
      operationId: putLens
      summary: Create or update a lens (UC-04, UC-05). Idempotent upsert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LensInput" }
            examples:
              standard:
                summary: Standard prime
                value:
                  brand: Nikon
                  model: Nikkor 50mm f/1.4 AI-S
                  mount: F
                  description: Sharp from f/2
                  focalLength: 50
                  maxAperture: 1.4
              wide:
                summary: Wide angle
                value:
                  brand: Nikon
                  model: Nikkor 28mm f/2.8 AI-S
                  mount: F
                  focalLength: 28
