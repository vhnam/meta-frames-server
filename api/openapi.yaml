      properties:
        fileNames: { type: array, items: { type: string }, minItems: 1 }
        startFrame:
          type: integer
          minimum: 0
          description: Number files sequentially from here in file-name order (UC-31)
        offset:
          type: integer
          description: Added to every number read from file names (UC-30 6a)
