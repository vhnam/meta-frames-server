        stockId: { type: string, format: uuid }
        stockBrand: { type: string }
        stockName: { type: string }
        shotIso: { type: integer }
        startedAt: { type: string, format: date }
        daysLoaded: { type: integer }
      example:
        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
        stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
        stockBrand: Kodak
        stockName: Portra 400
        shotIso: 800
        startedAt: "2026-09-01"
        daysLoaded: 31

    Camera:
      type: object
      required: [id, brand, model, hasFixedLens, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string }
        mount: { type: string }
        description: { type: string }
        hasFixedLens: { type: boolean }
        builtInLensId: { type: string, format: uuid }
        isActive: { type: boolean }
        loadedRoll: { $ref: "#/components/schemas/LoadedRoll" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
        createdAt: "2026-09-01T08:30:00Z"
        updatedAt: "2026-09-20T10:00:00Z"
        brand: Nikon
        model: FM2
        mount: F
        description: Black body, bought 2019
        hasFixedLens: false
        isActive: true
        loadedRoll:
          rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
          stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
          stockBrand: Kodak
          stockName: Portra 400
          shotIso: 800
          startedAt: "2026-09-01"
          daysLoaded: 31

