openapi: 3.0.3
info:
  title: Meta-Frame API
  version: 0.6.0
  description: |
    REST API for tracking rolls of film: gear, stock, shooting, processing and scans.

    **Creating records.** `POST /cameras|lenses|film-stocks|labs|scanners` assigns the id. `PUT /{resource}/{id}` is the
    idempotent create-or-update for clients that generate their own ids.

    **Deleting.** Nothing is physically deleted: `DELETE` sets `deleted_at` and the record disappears from
    every read. A deleted id stays reserved. Deleting something that is still in use is a `409`.

    **Audit.** Every change is recorded with its before/after row and the email of the signed-in user who
    made it; read the trail at `GET /audit-logs`.

    **Errors** always have the shape `{ code, message }`.

    **Accounts.** `/auth/*` handles registration, password login, sign-in with Google, logout and password
    recovery (powered by authboss). A successful register or login sets an HTTP-only session cookie; send it back
    (`credentials: "include"`) and read the signed-in user at `GET /auth/me`.

    **Your records only.** Every record belongs to the account that created it. Lists, searches, stats and the
    audit log only include your own records; another account's record answers `404` as if it did not exist,
    and a `PUT` with an id another account already uses is a `409 already_exists`.

    **Every other endpoint needs a session** and answers `401` without one; only `/health` and the `/auth`
    routes above are public. Five wrong passwords within 15 minutes lock the account for 15 minutes (`429`).
    Logging out ends the session on the server; resetting the password ends every session of the account.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
tags:
  - { name: System, description: Liveness check }
  - { name: Auth, description: "Accounts: register, log in, log out, recover a password" }
  - { name: Cameras, description: Camera bodies and their lenses }
  - { name: Lenses, description: Lenses }
  - { name: Film stocks, description: Film stocks and inventory }
  - { name: Labs, description: Labs that process film }
  - { name: Lab orders, description: "What a lab bills: an order, its lines, and the jobs on each line" }
  - { name: Scanners, description: "Built-in scanners plus the account's own (other lab machines, flatbeds, camera rigs)" }
  - { name: Rolls, description: "Rolls of film, from stock to shot, plus frames" }
  - { name: Processing, description: Sending rolls for development and scanning }
  - { name: Scans, description: Scan images }
  - { name: Stats, description: Search and statistics }
  - { name: Audit, description: Who changed what }

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: [] # public
      summary: Liveness check (does not touch the database)
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                up:
                  summary: Service is up
                  value:
                    status: ok

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: [] # public
      summary: Create an account with email and password, and log it in
      description: |
        The password needs at least 8 characters with an upper-case letter, a lower-case letter, a digit and a
        symbol. On success the response sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
            examples:
              withName:
                summary: Email, password and display name
                value:
                  email: ansel@example.com
                  password: "Zone-System5"
                  name: Ansel
      responses:
        "201":
          description: Registered and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
              examples:
                registered:
                  summary: New account, now logged in
                  value:
                    message: Account successfully created, you are now logged in
                    user:
                      id: 5a0c2f6e-8d31-4b7a-9e15-3c7f1d2b4a60
                      email: ansel@example.com
                      name: Ansel
                      createdAt: "2026-10-07T09:00:00Z"
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "409":
          description: The email already has an account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                emailTaken:
                  summary: Email already registered
                  value:
                    code: email_taken
                    message: User already exists

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: [] # public
      summary: Log in with email and password
      description: On success the response sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
            examples:
              credentials:
                summary: Email and password
                value:
                  email: ansel@example.com
                  password: "Zone-System5"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
              examples:
                loggedIn:
                  summary: Logged in
                  value:
                    message: Logged in
                    user:
                      id: 5a0c2f6e-8d31-4b7a-9e15-3c7f1d2b4a60
                      email: ansel@example.com
                      name: Ansel
                      createdAt: "2026-10-07T09:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unknown email or wrong password (the two are not told apart)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                invalidCredentials:
                  summary: Wrong email or password
                  value:
                    code: invalid_credentials
                    message: Invalid Credentials
        "429":
          description: Too many wrong passwords; the account is locked for 15 minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                locked:
                  summary: Account locked
                  value:
                    code: account_locked
                    message: Your account has been locked, please contact the administrator.

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [] # public
      summary: Log out and clear the session cookie
      responses:
        "200":
          description: Logged out (also when nobody was logged in)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
              examples:
                loggedOut:
                  summary: Logged out
                  value:
                    message: You have been logged out

  /auth/recover:
    post:
      tags: [Auth]
      operationId: startPasswordRecovery
      security: [] # public
      summary: Email a password-reset link
      description: |
        Sends a link to `{APP_URL}/recover/end?token=...`. The answer is the same whether or not the email has an
        account, so the endpoint cannot be used to discover accounts. The token is valid for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverStartInput" }
            examples:
              email:
                summary: Account email
                value:
                  email: ansel@example.com
      responses:
        "200":
          description: Recovery started (if the account exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
              examples:
                sent:
                  summary: Email sent if the account exists
                  value:
                    message: An email has been sent to you with further instructions on how to reset your password.
        "400": { $ref: "#/components/responses/AuthBadRequest" }

  /auth/recover/end:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: [] # public
      summary: Set a new password with the token from the recovery email
      description: The token works once. The user is not logged in afterwards; call `POST /auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordInput" }
            examples:
              reset:
                summary: Token from the email and the new password
                value:
                  token: "q3Jv0b5i8W1Xw9yQ5lD0p6c8R2nS7tU4vA1bC3dE5fG7hI9jK1lM3nO5pQ7rS9tU1vW3xY5zA7bC9dE1fG3hI5jK7lM9nO1pQ3rS5tU7vW9xY1zA3bC5dE7fA=="
                  password: "Fresh-Neg4tive"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
              examples:
                changed:
                  summary: Password changed
                  value:
                    message: Successfully updated password
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "422":
          description: The token is unknown, already used or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                invalidToken:
                  summary: Bad or expired token
                  value:
                    code: invalid_token
                    message: recovery token is invalid

  /auth/oauth2/google:
    get:
      tags: [Auth]
      operationId: startGoogleSignIn
      security: [] # public
      summary: Start "Sign in with Google" (navigate the browser here)
      description: |
        Not for `fetch`: send the browser here (`window.location`). It redirects to Google, Google redirects back to
        `/auth/oauth2/callback/google`, and that ends on the front end with the session cookie set. A Google
        account whose verified email matches an existing account signs in to that account and links it.
        `404 not_configured` when the server has no Google client.
      parameters:
        - name: redir
          in: query
          description: Front-end path to land on after sign-in, such as `/rolls`. Anything but a path becomes `/`.
          schema: { type: string, example: /rolls }
      responses:
        "302":
          description: Redirect to Google's sign-in page
          headers:
            Location: { schema: { type: string }, description: "Google's authorization URL" }
        "404":
          description: Google sign-in is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                notConfigured:
                  summary: No Google client configured
                  value:
                    code: not_configured
                    message: sign-in with Google is not configured

  /auth/oauth2/callback/google:
    get:
      tags: [Auth]
      operationId: finishGoogleSignIn
      security: [] # public
      summary: Google's redirect back after sign-in (register this URL with Google)
      description: |
        Google sends the browser here. On success the session cookie is set and the browser goes to
        `{APP_URL}{redir}`. On failure it goes to `{APP_URL}/login?error=<code>`, where code is `google_denied`
        (the user cancelled), `email_not_verified`, `account_conflict` (the email's account is linked to another
        Google account), `account_locked` or `google_failed`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Redirect to the front end
          headers:
            Location: { schema: { type: string }, description: "`{APP_URL}{redir}`, or `{APP_URL}/login?error=<code>`" }

  /auth/google/config:
    get:
      tags: [Auth]
      operationId: getGoogleConfig
      security: [] # public
      summary: The web client id a mobile app names when it requests a Google ID token
      responses:
        "200":
          description: The server's web client id (`GOOGLE_CLIENT_ID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConfig" }
        "404":
          description: "`not_configured`: the server has no web client"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/google/token:
    post:
      tags: [Auth]
      operationId: signInWithGoogleToken
      security: [] # public
      summary: Sign in a mobile app with a Google ID token
      description: |
        For native apps, which get an ID token from the device's Google account picker. The server checks the token
        against Google's keys and requires its audience to be `GOOGLE_CLIENT_ID` or one of `GOOGLE_MOBILE_CLIENT_IDS`.
        It then finds or creates the account as the browser flow does and sets the session cookie, like `/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleTokenInput" }
      responses:
        "200":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400":
          description: Missing token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: "`invalid_google_token`: the signature, expiry, issuer or audience is wrong"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`email_not_verified`: Google has not verified the email"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: "`not_configured`: the server accepts no Google clients"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`account_conflict`: the email's account is linked to another Google account"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: "`account_locked`: too many wrong passwords"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The user of the current session
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              examples:
                me:
                  summary: Signed-in user
                  value:
                    id: 5a0c2f6e-8d31-4b7a-9e15-3c7f1d2b4a60
                    email: ansel@example.com
                    name: Ansel
                    createdAt: "2026-10-07T09:00:00Z"
        "401":
          description: No valid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                unauthorized:
                  summary: Not logged in
                  value:
                    code: unauthorized
                    message: not logged in

  /cameras:
    get:
      tags: [Cameras]
      operationId: listCameras
      summary: List cameras with their loaded roll (UC-09)
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Cameras
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Camera" } }
              examples:
                cameras:
                  summary: One loaded and one idle camera
                  value:
                    - id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                      brand: Nikon
                      model: FM2
                      mount: F
                      description: "Black body, bought 2019"
                      hasFixedLens: false
                      isActive: true
                      loadedRoll:
                        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
                        stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
                        stockBrand: Kodak
                        stockName: Portra 400
                        shotIso: 800
                        startedAt: "2026-09-01"
                        daysLoaded: 31
                      createdAt: "2026-09-01T08:30:00Z"
                      updatedAt: "2026-09-20T10:00:00Z"
                    - id: 0b9e4c52-3a1f-4d85-8c36-9e5a7d2f1b02
                      brand: Canon
                      model: Canonet QL17
                      hasFixedLens: true
                      builtInLensId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      isActive: true
                      createdAt: "2026-09-01T08:30:00Z"
                      updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Cameras]
      operationId: createCamera
      summary: Create a camera; the server assigns its id (UC-01, UC-07)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraInput" }
            examples:
              interchangeableLens:
                summary: Interchangeable-lens camera (needs a mount)
                value:
                  brand: Nikon
                  model: FM2
                  mount: F
                  description: "Black body, bought 2019"
                  hasFixedLens: false
              fixedLens:
                summary: Fixed-lens camera (creates its built-in lens)
                value:
                  brand: Canon
                  model: Canonet QL17
                  hasFixedLens: true
                  fixedLens:
                    focalLength: 40
                    maxAperture: 1.7
                    brand: Canon
                    model: "40mm f/1.7"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                interchangeableLens:
                  summary: Interchangeable-lens camera
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
                fixedLens:
                  summary: Fixed-lens camera with its built-in lens id
                  value:
                    id: 0b9e4c52-3a1f-4d85-8c36-9e5a7d2f1b02
                    brand: Canon
                    model: Canonet QL17
                    hasFixedLens: true
                    builtInLensId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Cameras]
      operationId: getCamera
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Camera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                loaded:
                  summary: Camera holding a roll
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    loadedRoll:
                      rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
                      stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
                      stockBrand: Kodak
                      stockName: Portra 400
                      shotIso: 800
                      startedAt: "2026-09-01"
                      daysLoaded: 31
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
                idle:
                  summary: Camera with no roll
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Cameras]
      operationId: putCamera
      summary: Create or update a camera (UC-01, UC-02, UC-07). Idempotent upsert.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatchCreateOnly"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraInput" }
            examples:
              interchangeableLens:
                summary: Interchangeable-lens camera (needs a mount)
                value:
                  brand: Nikon
                  model: FM2
                  mount: F
                  description: "Black body, bought 2019"
                  hasFixedLens: false
              fixedLens:
                summary: Fixed-lens camera (creates its built-in lens)
                value:
                  brand: Canon
                  model: Canonet QL17
                  hasFixedLens: true
                  fixedLens:
                    focalLength: 40
                    maxAperture: 1.7
                    brand: Canon
                    model: "40mm f/1.7"
              update:
                summary: Edit an existing camera
                value:
                  brand: Nikon
                  model: FM3A
                  mount: F
                  hasFixedLens: false
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                updated:
                  summary: Updated camera
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                created:
                  summary: Created camera
                  value:
                    id: 0b9e4c52-3a1f-4d85-8c36-9e5a7d2f1b02
                    brand: Canon
                    model: Canonet QL17
                    hasFixedLens: true
                    builtInLensId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    isActive: true
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Cameras]
      operationId: deleteCamera
      summary: Delete a camera that never held a roll, together with its built-in lens
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cameras/{id}/active:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Cameras]
      operationId: setCameraActive
      summary: Activate or deactivate a camera (UC-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveInput" }
            examples:
              deactivate:
                summary: Retire a camera
                value:
                  isActive: false
              activate:
                summary: Bring it back
                value:
                  isActive: true
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Camera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
              examples:
                deactivated:
                  summary: Camera retired
                  value:
                    id: 7d1c5a3e-5b0a-4f6e-9a77-2f1d0c9b8a01
                    brand: Nikon
                    model: FM2
                    mount: F
                    description: "Black body, bought 2019"
                    hasFixedLens: false
                    isActive: false
                    createdAt: "2026-09-01T08:30:00Z"
                    updatedAt: "2026-09-20T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cameras/{id}/lenses:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Cameras]
      operationId: listCameraLenses
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Lenses linked to the camera
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lens" } }
              examples:
                lenses:
                  summary: Lenses linked to the camera
                  value:
