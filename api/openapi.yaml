    post:
      tags: [Lenses]
      operationId: createLens
      summary: Create a lens; the server assigns its id (UC-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LensInput" }
            examples:
              standard:
                summary: Standard prime
                value:
                  brand: Nikon
                  model: Nikkor 50mm f/1.4 AI-S
                  mount: F
                  description: Sharp from f/2
