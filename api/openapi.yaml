components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: metaframes_session
      description: Set by `POST /auth/login` and `POST /auth/register`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatchRollVersion:
      name: If-Match
      in: header
      description: >-
        Write only if the roll is still at this version: `"<version>"` (a strong entity tag
        holding `RollSummary.version`), several comma-separated, or `*` for any version. A
        different version gets `412 roll_changed` and nothing is written. Weak tags (`W/"…"`) and
        anything else malformed are refused with `400 invalid_precondition`. Without the header
        the edit overwrites whatever is stored.
      schema:
        type: string
        maxLength: 1000
        example: '"3"'
    IfNoneMatchCreateOnly:
      name: If-None-Match
      in: header
      description: >-
        `*` makes the PUT create-only: the record is created at this id, or, if any record already
        holds the id (yours, deleted, or another account's), `412 already_exists` and nothing is
        changed. Any other value is refused with `400`. Without the header the PUT creates or
        updates.
      schema:
        type: string
        enum: ["*"]

  responses:
    Unauthorized:
      description: No valid session; log in first
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unauthorized:
              summary: Not logged in
              value:
                code: unauthorized
                message: not logged in
    AuthBadRequest:
      description: The body does not match the schema, or a field breaks an account rule (such as password strength)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            weakPassword:
              summary: Password too weak
              value:
                code: validation_failed
                message: "password: Must be at least 8 characters, Must contain at least 1 symbol"
            badEmail:
              summary: Not an email address
              value:
                code: validation_failed
                message: "email: Must be a valid e-mail address"
    BadRequest:
      description: "Malformed request: the body, a parameter or an id does not match the schema"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            schema:
              summary: Body does not match the schema
              value:
                code: bad_request
                message: "request body has an error: doesn't match schema"
            badId:
              summary: Malformed id in the path
              value:
                code: bad_request
                message: "parameter \"id\" in path has an error: value is not a valid uuid"
    NotFound:
      description: Not found (or deleted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            camera:
              summary: Unknown camera
              value:
                code: not_found
                message: camera not found
            roll:
              summary: Unknown or deleted roll
              value:
                code: not_found
                message: roll not found
            scan:
              summary: Unknown scan
              value:
                code: not_found
                message: scan not found
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            cameraInUse:
              summary: Camera that held rolls cannot be deleted
              value:
                code: camera_in_use
                message: "a camera that has held rolls cannot be deleted; deactivate it instead"
            lensInUse:
              summary: Lens used on rolls
              value:
                code: lens_in_use
                message: "a lens used on rolls cannot be deleted; deactivate it instead"
            filmStockInUse:
              summary: Stock with rolls or derived stocks
              value:
                code: film_stock_in_use
                message: a film stock with rolls or derived stocks cannot be deleted
            labInUse:
              summary: Lab with processing history
              value:
                code: lab_in_use
                message: a lab with processing history cannot be deleted
            rollNotInStock:
              summary: Only rolls still in stock can be loaded or deleted
              value:
                code: roll_not_in_stock
                message: only a roll that is still in stock can be deleted
            jobHasScans:
              summary: Job with scans
              value:
                code: job_has_scans
                message: "a job with scans cannot be deleted; delete its scans first"
            cameraLoaded:
              summary: Camera already holds a roll
              value:
                code: camera_loaded
                message: "camera already holds a roll; finish it first"
            rollLoadedDifferently:
              summary: The roll is already in this camera with a different date, shot ISO or lenses
              value:
                code: roll_loaded_differently
                message: the roll is already loaded into this camera with different details
            rollNotInCamera:
              summary: Only a roll in a camera can be finished (or it was finished on another date)
              value:
                code: roll_not_in_camera
                message: only a roll in a camera can be finished
            frameNotesConflict:
              summary: The frame's notes changed since the edit's baseNotes
              value:
                code: frame_notes_conflict
                message: the frame's notes were changed elsewhere
            rollNotesConflict:
              summary: The roll's notes changed since the edit's baseDescription
              value:
                code: roll_notes_conflict
                message: the roll's notes were changed elsewhere
            alreadyExists:
              summary: A deleted id stays reserved
              value:
                code: already_exists
                message: a camera with this id already exists
            scannerInUse:
              summary: Scanner used by a job or a scan
              value:
                code: scanner_in_use
                message: a scanner used by a job or a scan cannot be deleted
            builtInScanner:
              summary: Built-in scanners are read-only
              value:
                code: built_in_scanner
                message: built-in scanners cannot be changed
            scannerHasScans:
              summary: Removing a scanner that already has scans
              value:
                code: scanner_has_scans
                message: "a scanner with imported scans cannot be removed from the order; delete its scans first"
    PreconditionFailed:
      description: "A precondition header did not hold: nothing was written"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            rollChanged:
              summary: The roll changed since the version in If-Match
              value:
                code: roll_changed
                message: the roll was changed since it was loaded; reload it and apply your edit again
            alreadyExists:
              summary: "If-None-Match: * and the id is already taken"
              value:
                code: already_exists
                message: a camera with this id already exists
    Unprocessable:
      description: Business validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missingFields:
              summary: A required field is blank
              value:
                code: missing_fields
                message: brand and model are required
            invalidAperture:
              summary: Aperture with two decimals
              value:
                code: invalid_aperture
                message: max aperture must have at most one decimal place
            fixedLensRequired:
              summary: Fixed-lens camera without its lens
              value:
                code: fixed_lens_required
                message: fixedLens is required for a fixed-lens camera
            scanOrdersRequired:
              summary: Scanning job without a scanner
              value:
                code: scan_orders_required
                message: scanOrders needs at least one scanner for this job type
            scanNotApplicable:
              summary: Develop or print job with scanners
              value:
                code: scan_not_applicable
                message: scanOrders must be empty for this job type
            duplicateScanner:
              summary: Same scanner twice
              value:
                code: duplicate_scanner
                message: each scanner can appear only once in scanOrders
            invalidScanSettings:
              summary: Settings the scanner's kind does not offer
              value:
                code: invalid_scan_settings
                message: pixel_shift is not an option of this scanner
            unknownScanner:
              summary: Scanner id that the account cannot use
              value:
                code: unknown_scanner
                message: scanner does not exist
            invalidScanner:
              summary: Neither or both of scannerId and scanner
              value:
                code: invalid_scanner
                message: give either scannerId or scanner
            scannerNotOrdered:
              summary: Scan imported for a scanner that was not ordered
              value:
                code: scanner_not_ordered
                message: this scanner was not ordered for the job

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
      example:
        status: ok

    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
      example:
        code: not_found
        message: camera not found

    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { type: string, format: date-time }
      example:
        id: 5a0c2f6e-8d31-4b7a-9e15-3c7f1d2b4a60
        email: ansel@example.com
        name: Ansel
        createdAt: "2026-10-07T09:00:00Z"

    AuthResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
        user: { $ref: "#/components/schemas/User" }
      example:
        message: Logged in

    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, maxLength: 100 }
      example:
        email: ansel@example.com
        password: "Zone-System5"
        name: Ansel

    GoogleConfig:
      type: object
      required: [serverClientId]
      properties:
        serverClientId: { type: string }

    GoogleTokenInput:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 1, maxLength: 8192 }

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 72 }
      example:
        email: ansel@example.com
        password: "Zone-System5"

    RecoverStartInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
      example:
        email: ansel@example.com

    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8, maxLength: 72 }
      example:
        token: "q3Jv0b5i8W1Xw9yQ5lD0p6c8R2nS7tU4vA1bC3dE5fG7hI9jK1lM3nO5pQ7rS9tU1vW3xY5zA7bC9dE1fG3hI5jK7lM9nO1pQ3rS5tU7vW9xY1zA3bC5dE7fA=="
        password: "Fresh-Neg4tive"

    ActiveInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
      example:
        isActive: false

    StockType: { type: string, enum: [color, bw, slide] }
    Process: { type: string, enum: [C-41, E-6, BW, ECN-2] }
    Packaging: { type: string, enum: [factory, repack, respooled] }

    FixedLensInput:
      type: object
      required: [focalLength, maxAperture]
      properties:
        focalLength: { type: integer, minimum: 1 }
        maxAperture: { type: number, format: double, minimum: 0.1, maximum: 99.9 }
        brand: { type: string }
        model: { type: string }
      example:
        focalLength: 40
        maxAperture: 1.7
        brand: Canon
        model: 40mm f/1.7

    CameraInput:
      type: object
      required: [brand, model, hasFixedLens]
      properties:
        brand: { type: string }
        model: { type: string }
        mount: { type: string }
        description: { type: string }
        hasFixedLens: { type: boolean }
        fixedLens:
          description: Required when creating a fixed-lens camera (UC-07)
          $ref: "#/components/schemas/FixedLensInput"
      example:
        brand: Nikon
        model: FM2
        mount: F
        description: Black body, bought 2019
        hasFixedLens: false

    LoadedRoll:
      type: object
      required: [rollId, stockId, stockBrand, stockName, daysLoaded]
      properties:
        rollId: { type: string, format: uuid }
        stockId: { type: string, format: uuid }
        stockBrand: { type: string }
        stockName: { type: string }
        shotIso: { type: integer }
        startedAt: { type: string, format: date }
        daysLoaded: { type: integer }
      example:
        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
        stockId: e1b7a4d9-0c58-4a32-b6f1-5d9c2e8a7b05
        stockBrand: Kodak
        stockName: Portra 400
        shotIso: 800
        startedAt: "2026-09-01"
        daysLoaded: 31

    Camera:
      type: object
      required: [id, brand, model, hasFixedLens, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string }
        mount: { type: string }
        description: { type: string }
        hasFixedLens: { type: boolean }
        builtInLensId: { type: string, format: uuid }
        isActive: { type: boolean }
        loadedRoll: { $ref: "#/components/schemas/LoadedRoll" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
