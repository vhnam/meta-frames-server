components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: "Malformed request: the body, a parameter or an id does not match the schema"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            schema:
              summary: Body does not match the schema
              value:
                code: bad_request
                message: "request body has an error: doesn't match schema"
            badId:
              summary: Malformed id in the path
              value:
                code: bad_request
                message: "parameter \"id\" in path has an error: value is not a valid uuid"
    NotFound:
      description: Not found (or deleted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            camera:
              summary: Unknown camera
              value:
                code: not_found
                message: camera not found
            roll:
              summary: Unknown or deleted roll
              value:
                code: not_found
                message: roll not found
            scan:
              summary: Unknown scan
              value:
                code: not_found
                message: scan not found
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            cameraInUse:
              summary: Camera that held rolls cannot be deleted
              value:
                code: camera_in_use
                message: "a camera that has held rolls cannot be deleted; deactivate it instead"
            lensInUse:
              summary: Lens used on rolls
              value:
                code: lens_in_use
                message: "a lens used on rolls cannot be deleted; deactivate it instead"
            filmStockInUse:
              summary: Stock with rolls or derived stocks
              value:
                code: film_stock_in_use
                message: a film stock with rolls or derived stocks cannot be deleted
            labInUse:
              summary: Lab with processing history
              value:
                code: lab_in_use
                message: a lab with processing history cannot be deleted
            rollNotInStock:
              summary: Only rolls still in stock can be loaded or deleted
              value:
                code: roll_not_in_stock
                message: only a roll that is still in stock can be deleted
            jobHasScans:
              summary: Job with scans
              value:
                code: job_has_scans
                message: "a job with scans cannot be deleted; delete its scans first"
            cameraLoaded:
              summary: Camera already holds a roll
              value:
                code: camera_loaded
                message: "camera already holds a roll; finish it first"
            alreadyExists:
              summary: A deleted id stays reserved
              value:
                code: already_exists
                message: a camera with this id already exists
    Unprocessable:
      description: Business validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missingFields:
              summary: A required field is blank
              value:
                code: missing_fields
                message: brand and model are required
            invalidAperture:
              summary: Aperture with two decimals
              value:
                code: invalid_aperture
                message: max aperture must have at most one decimal place
            fixedLensRequired:
              summary: Fixed-lens camera without its lens
              value:
                code: fixed_lens_required
                message: fixedLens is required for a fixed-lens camera

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
      example:
        status: ok

    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
      example:
        code: not_found
        message: camera not found

    ActiveInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
      example:
        isActive: false

    StockType: { type: string, enum: [color, bw, slide] }
    Process: { type: string, enum: [C-41, E-6, BW, ECN-2] }
    Packaging: { type: string, enum: [factory, repack, respooled] }

    FixedLensInput:
      type: object
      required: [focalLength, maxAperture]
      properties:
        focalLength: { type: integer, minimum: 1 }
        maxAperture: { type: number, format: double, minimum: 0.1, maximum: 99.9 }
        brand: { type: string }
        model: { type: string }
      example:
        focalLength: 40
        maxAperture: 1.7
        brand: Canon
        model: 40mm f/1.7

    CameraInput:
      type: object
      required: [brand, model, hasFixedLens]
      properties:
        brand: { type: string }
        model: { type: string }
        mount: { type: string }
        description: { type: string }
        hasFixedLens: { type: boolean }
        fixedLens:
          description: Required when creating a fixed-lens camera (UC-07)
          $ref: "#/components/schemas/FixedLensInput"
      example:
        brand: Nikon
        model: FM2
        mount: F
        description: Black body, bought 2019
        hasFixedLens: false

    LoadedRoll:
      type: object
      required: [rollId, stockId, stockBrand, stockName, daysLoaded]
