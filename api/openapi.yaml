    FrameInput:
      type: object
      properties:
        notes: { type: string }
        baseNotes:
          type: string
          description: >-
            The notes this edit was based on ("" when the frame had none). When sent, the server
            compares trimmed text: if the frame already holds `notes`, nothing is written (200);
            if it still holds `baseNotes`, `notes` is saved; otherwise `409 frame_notes_conflict`
            and nothing changes. Leave it out to overwrite whatever is stored.
      example:
        notes: Golden hour on the bridge
        baseNotes: ""

    RollNotesInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          description: The roll's notes. Blank clears them.
        baseDescription:
          type: string
          description: >-
            The notes this edit was based on ("" when the roll had none). Same rules as
            `FrameInput.baseNotes`, with `409 roll_notes_conflict`. Leave it out to overwrite.
      example:
        description: "Hanoi street trip, overcast, roll jammed at 30"
        baseDescription: Hanoi street trip

