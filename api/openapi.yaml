    ProcessingInput:
      type: object
      required: [type]
      properties:
        labId: { type: string, format: uuid, description: Absent means processed at home }
        type: { $ref: "#/components/schemas/ProcessingType" }
        process:
          allOf: [{ $ref: "#/components/schemas/Process" }]
          description: >-
            Defaults to the film stock's process for a new job. On an existing job it replaces the
            process; absent keeps the current one.
        sentAt: { type: string, format: date, description: Defaults to today }
        scansExpectedAt:
          type: string
          format: date
          description: >-
            When the lab expects to deliver the scans. Optional; must not be before sentAt.
            Only for type scan and develop_scan.
        negativesExpectedAt:
          type: string
          format: date
          description: >-
            When the lab expects to return the negatives. Optional; must not be before sentAt.
            Only for type develop and develop_scan.
        price:
          type: integer
          minimum: 0
          description: The job's own price. Not allowed with orderItemIds, where the order lines set it (`422 price_from_order`).
        orderItemIds:
          type: array
          items: { type: string, format: uuid }
          description: >-
            The order lines this job is billed on, such as one for developing and one for scanning.
            They must be on one order (`422 order_items_on_two_orders`) from the job's lab
            (`422 order_lab_mismatch`), and each must have room (`409 order_item_full`). Replaces
            the current set; absent or empty takes the job off its order.
        notes: { type: string }
        scanOrders:
          type: array
          items: { $ref: "#/components/schemas/ScanOrderInput" }
          description: >-
            Replaces the current set. Required (at least one) for type scan and develop_scan;
            must be empty for develop and print.
      example:
        labId: 3eaf7b5c-1a49-4d86-c2f5-8b4dac6e9c09
        type: develop_scan
        process: C-41
        sentAt: "2026-09-20"
        scansExpectedAt: "2026-10-04"
        price: 90000
        notes: Push 1 stop
        scanOrders:
          - scannerId: d177cb3c-a850-4232-a4ca-75189b7b279b
            hiRes: false

    ScanOrderInput:
      type: object
      description: |
        Names the scanner by scannerId, or by the deprecated scanner code; exactly one of the two.
        Without settings (or the deprecated hiRes), an order already on the job keeps its settings and
        a new one starts from the scanner's defaultSettings.
      properties:
        scannerId: { type: string, format: uuid }
        scanner: { $ref: "#/components/schemas/ScannerCode" }
        settings: { $ref: "#/components/schemas/ScanSettings" }
        hiRes:
          type: boolean
          deprecated: true
          description: Old flag for settings { resolution hi_res } (true) or { resolution standard } (false); ignored with settings.
      example:
        scannerId: d177cb3c-a850-4232-a4ca-75189b7b279b
        settings:
          resolution: hi_res
          format: tiff

    ScanOrder:
      type: object
      required: [scanner, scannerId, scannerName, settings, hiRes, scanCount]
      properties:
        scanner: { $ref: "#/components/schemas/ScannerCode" }
        scannerId: { type: string, format: uuid }
        scannerName: { type: string }
        settings: { $ref: "#/components/schemas/ScanSettings" }
        hiRes: { type: boolean, deprecated: true, description: "settings.resolution is hi_res" }
        scanCount: { type: integer, minimum: 0, description: Scans imported for this scanner so far }
      example:
        scanner: noritsu
        scannerId: d177cb3c-a850-4232-a4ca-75189b7b279b
        scannerName: Noritsu HS-1800
        hiRes: true
        scanCount: 36
        settings:
          resolution: hi_res

    Processing:
      type: object
      required: [id, rollId, type, process, sentAt, scanOrders, isOpen]
      properties:
        id: { type: string, format: uuid }
        rollId: { type: string, format: uuid }
        labId: { type: string, format: uuid }
        labName: { type: string }
        type: { $ref: "#/components/schemas/ProcessingType" }
        process: { $ref: "#/components/schemas/Process" }
        sentAt: { type: string, format: date }
        scansReceivedAt: { type: string, format: date }
        scansExpectedAt: { type: string, format: date }
        negativesExpectedAt: { type: string, format: date }
        negativesReturnedAt: { type: string, format: date }
        price:
          type: integer
          description: From its order lines added up, with the order's VAT and discount shared out, when the job is on an order; otherwise the job's own price
        order: { $ref: "#/components/schemas/ProcessingOrder" }
        notes: { type: string }
        scanOrders: { type: array, items: { $ref: "#/components/schemas/ScanOrder" } }
        isOpen: { type: boolean }
      example:
        id: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08
        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
        labId: 3eaf7b5c-1a49-4d86-c2f5-8b4dac6e9c09
        labName: Saigon Film Lab
        type: develop_scan
        process: C-41
        sentAt: "2026-09-20"
        scansReceivedAt: "2026-09-27"
        scansExpectedAt: "2026-10-04"
        price: 90000
        notes: Push 1 stop
        scanOrders:
          - scanner: noritsu
            scannerId: d177cb3c-a850-4232-a4ca-75189b7b279b
            scannerName: Noritsu HS-1800
            hiRes: false
            scanCount: 36
            settings:
              resolution: standard
        isOpen: true

    NegativesAtLabItem:
      type: object
      required: [processingId, rollId, labName, type, sentAt, daysSinceSent, stockName]
      properties:
        processingId: { type: string, format: uuid }
        rollId: { type: string, format: uuid }
        labName: { type: string }
        type: { $ref: "#/components/schemas/ProcessingType" }
        sentAt: { type: string, format: date }
        daysSinceSent: { type: integer }
        stockName: { type: string }
      example:
        processingId: 2d9e6a4b-0f38-4c75-b1e4-7a3c9f5d8b08
        rollId: 1c8d5f3a-9e27-4b64-a0d3-6f2b8e4c7a07
        labName: Saigon Film Lab
        type: develop_scan
        sentAt: "2026-09-20"
        daysSinceSent: 12
        stockName: Kodak Portra 400

    Scan:
